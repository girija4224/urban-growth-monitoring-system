{% extends "base.html" %}
{% block title %}Sign In — Urban Growth AI{% endblock %}

{% block layout %}
<div class="main-content" style="justify-content: center; min-height: 100vh;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.75rem 2.25rem;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--primary-gradient); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; margin-bottom: 1rem; box-shadow: 0 8px 24px var(--primary-glow);">
                <i class="bi bi-person-fill-lock"></i>
            </div>
            <h2 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your geospatial monitoring studio</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label><i class="bi bi-person"></i> Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label><i class="bi bi-key"></i> Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; padding: 0.95rem;">
                <i class="bi bi-box-arrow-in-right"></i> Sign In to Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? 
            <a href="{{ url_for('signup') }}" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Sign Up</a>
            <div style="margin-top: 0.75rem;">
                <a href="{{ url_for('admin_login') }}" style="color: var(--text-dim); text-decoration: none; font-size: 0.825rem;">
                    <i class="bi bi-shield-lock"></i> Admin Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

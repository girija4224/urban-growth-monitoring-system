{% extends "base.html" %}
{% block title %}Admin Console Sign In — Urban Growth AI{% endblock %}

{% block layout %}
<div class="main-content" style="justify-content: center; min-height: 100vh;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.75rem 2.25rem;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: linear-gradient(135deg, #f59e0b, #ef4444); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Admin Access</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Elevated permissions required for dataset and training orchestration</p>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label><i class="bi bi-person-badge"></i> Admin Username</label>
                <input type="text" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label><i class="bi bi-key-fill"></i> Security Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-danger" style="width: 100%; margin-top: 1rem; padding: 0.95rem;">
                <i class="bi bi-unlock-fill"></i> Authenticate Console
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem;">
            <a href="{{ url_for('login') }}" style="color: var(--text-dim); text-decoration: none;">
                <i class="bi bi-arrow-left"></i> Return to User Portal
            </a>
        </div>
    </div>
</div>
{% endblock %}
